<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>Nikolina &amp; Kristijan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Great+Vibes&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f1e8; --paper: #fffdf9; --ink: #3d352e; --muted: #8c8075;
    --gold: #b8955a; --gold-deep: #9a7a45; --sage: #8a9a7b; --line: #e6dccd;
    --ok: #6b8f5e; --err: #b5523b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  [hidden] { display: none !important; }
  body {
    min-height: 100vh; color: var(--ink); font-family: 'Jost', system-ui, sans-serif; font-weight: 300;
    background:
      radial-gradient(ellipse at 15% 0%, #efe3d0 0%, transparent 55%),
      radial-gradient(ellipse at 100% 100%, #e9ecdf 0%, transparent 50%),
      var(--bg);
    background-attachment: fixed;
  }
  main { max-width: 460px; margin: 0 auto; padding: 36px 16px 48px; }

  .card {
    background: var(--paper); border-radius: 28px; padding: 36px 24px 28px; text-align: center;
    box-shadow: 0 1px 0 #fff inset, 0 20px 50px -24px rgba(90, 70, 40, .35);
    border: 1px solid var(--line); position: relative; overflow: hidden;
  }
  .card::before {
    content: ''; position: absolute; inset: 10px; border: 1px solid var(--line); border-radius: 20px; pointer-events: none;
  }

  .sprig { width: 120px; height: auto; color: var(--sage); margin: 0 auto 6px; display: block; }
  .eyebrow { font-size: .72rem; letter-spacing: .32em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; }
  h1 { font-family: 'Great Vibes', cursive; font-weight: 400; font-size: 3.1rem; line-height: 1.05; margin: 0; color: var(--ink); }
  h1 .amp { color: var(--gold); font-size: .8em; padding: 0 .1em; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px auto 16px; max-width: 220px; color: var(--gold); }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  .lead { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.3rem; line-height: 1.4; margin: 0 0 6px; }
  .table-tag {
    display: inline-block; margin-top: 8px; padding: 5px 14px; border-radius: 999px; font-size: .78rem;
    letter-spacing: .14em; text-transform: uppercase; color: var(--gold-deep); background: #f6eedf;
  }

  .pick {
    margin-top: 26px; display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; padding: 18px 20px; border-radius: 16px; cursor: pointer; position: relative; z-index: 1;
    font: 500 1.05rem 'Jost', sans-serif; letter-spacing: .04em; color: #fff;
    background: linear-gradient(135deg, var(--gold) 0%, var(--gold-deep) 100%);
    box-shadow: 0 10px 24px -10px rgba(154, 122, 69, .8); transition: transform .15s, box-shadow .15s;
  }
  .pick:active { transform: scale(.98); box-shadow: 0 6px 14px -8px rgba(154, 122, 69, .8); }
  .pick input { display: none; }
  .pick svg { width: 22px; height: 22px; }
  .pick.busy { opacity: .6; pointer-events: none; }
  .hint { font-size: .8rem; color: var(--muted); margin: 12px 0 0; }

  .progress { margin: 26px 0 0; display: none; }
  .progress.show { display: block; }
  .bar { height: 6px; border-radius: 99px; background: #efe6d8; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--sage), var(--gold)); transition: width .4s ease; }
  #status { margin: 10px 0 0; font-size: .92rem; }
  #status.done { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 1.35rem; color: var(--gold-deep); }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 18px; }
  .tile { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: #f1e9dc; }
  .tile img, .tile video { width: 100%; height: 100%; object-fit: cover; display: block; position: relative; z-index: 1; }
  .tile .ph { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 1.6rem; }
  .tile .badge {
    position: absolute; inset: 0; z-index: 2; display: grid; place-items: center; transition: background .3s;
    background: rgba(255, 253, 249, .55);
  }
  .tile .badge span {
    width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
    font-size: .95rem; color: #fff; background: rgba(61, 53, 46, .35);
  }
  .tile.up .badge span { border: 2px solid rgba(255,255,255,.6); border-top-color: #fff; animation: spin .8s linear infinite; }
  .tile.ok .badge { background: transparent; }
  .tile.ok .badge span { background: var(--ok); width: 24px; height: 24px; font-size: .8rem; position: absolute; right: 6px; bottom: 6px; }
  .tile.err .badge { background: rgba(181, 82, 59, .25); }
  .tile.err .badge span { background: var(--err); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .bad { color: var(--err); font-size: .95rem; margin-top: 24px; }
  footer { text-align: center; margin-top: 22px; font-family: 'Cormorant Garamond', serif; font-style: italic; color: var(--muted); font-size: 1rem; }
</style>
</head>
<body>
<main>
  <div class="card">
    <svg class="sprig" viewBox="0 0 120 34" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" aria-hidden="true">
      <path d="M8 26 C 40 26, 80 26, 112 26"/>
      <path d="M60 26 C 58 18, 52 12, 44 10 C 46 18, 52 23, 60 26Z" fill="currentColor" fill-opacity=".15"/>
      <path d="M60 26 C 62 18, 68 12, 76 10 C 74 18, 68 23, 60 26Z" fill="currentColor" fill-opacity=".15"/>
      <path d="M38 26 C 34 20, 28 17, 22 17 C 26 22, 31 25, 38 26Z" fill="currentColor" fill-opacity=".1"/>
      <path d="M82 26 C 86 20, 92 17, 98 17 C 94 22, 89 25, 82 26Z" fill="currentColor" fill-opacity=".1"/>
      <circle cx="60" cy="7" r="2.2" fill="#b8955a" stroke="none"/>
    </svg>
    <p class="eyebrow" data-i18n="eyebrow">Vjenčanje</p>
    <h1>Nikolina <span class="amp">&amp;</span> Kristijan</h1>
    <div class="divider">♡</div>
    <p class="lead" data-i18n="lead">Podijelite s nama trenutke koje ste uhvatili</p>
    <span class="table-tag" id="tableTag" hidden></span>

    <label class="pick" id="pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span data-i18n="pick">Odaberite fotografije</span>
      <input type="file" id="files" accept="image/*,video/*" multiple>
    </label>
    <p class="hint" id="hint" data-i18n="hint">Fotografije i videi · možete odabrati više odjednom</p>

    <div class="progress" id="progress">
      <div class="bar"><i id="barFill"></i></div>
      <p id="status"></p>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <footer data-i18n="footer">Hvala što slavite s nama</footer>
</main>

<script>
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxOCgH8g0To7cO6rYyrjHRfTW9-GF4bXlnfjw5tXID_NdVOM9Xv6aV7KdW0G4-dyB6kfw/exec';
  const MAX_BYTES = 40 * 1024 * 1024;
  const PARALLEL = 3;          // files sent at the same time
  const SHRINK_PHOTOS = true;  // false = always send untouched originals (slower)
  const MAX_SIDE = 3000;       // px, longest side after shrinking (~20x30 cm print quality)

  // Croatian for hr/bs/sr phones, English for everyone else
  const HR = /^(hr|bs|sr|sh)/i.test(navigator.language || '');
  const T = HR ? {
    eyebrow: 'Vjenčanje', lead: 'Podijelite s nama trenutke koje ste uhvatili',
    pick: 'Odaberite fotografije', hint: 'Fotografije i videi · možete odabrati više odjednom',
    footer: 'Hvala što slavite s nama', table: 'Stol',
    uploading: (i, n) => `Poslano ${i} od ${n}… molimo ne zatvarajte stranicu`,
    done: (n) => `Hvala vam! Poslano: ${n} ♡`,
    partial: (d, f) => `Poslano ${d}, neuspješno ${f}. Pokušajte ponovno s onima koje nisu prošle.`,
    tooBig: 'Datoteka je prevelika (max 40 MB)', more: 'Dodajte još',
    noKey: 'Molimo skenirajte QR kod na svom stolu kako biste otvorili ovu stranicu.',
  } : {
    eyebrow: 'Our wedding', lead: 'Share the moments you captured with us',
    pick: 'Choose photos', hint: 'Photos & videos · you can pick several at once',
    footer: 'Thank you for celebrating with us', table: 'Table',
    uploading: (i, n) => `Sent ${i} of ${n}… please keep this page open`,
    done: (n) => `Thank you! ${n} sent ♡`,
    partial: (d, f) => `${d} sent, ${f} failed. Please try the failed ones again.`,
    tooBig: 'File too large (max 40 MB)', more: 'Add more',
    noKey: 'Please scan the QR code on your table to open this page.',
  };
  document.documentElement.lang = HR ? 'hr' : 'en';
  document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = T[el.dataset.i18n]; });

  const params = new URLSearchParams(location.search);
  const table = params.get('t') || '';
  const key = params.get('k') || '';
  const $ = (id) => document.getElementById(id);
  const status = $('status');

  if (table) { $('tableTag').textContent = `${T.table} ${table}`; $('tableTag').hidden = false; }
  if (!key) {
    $('pick').hidden = true; $('hint').hidden = true;
    $('progress').insertAdjacentHTML('beforebegin', `<p class="bad">${T.noKey}</p>`);
  }

  $('files').addEventListener('change', async (e) => {
    const files = [...e.target.files];
    e.target.value = '';
    if (!files.length) return;

    $('pick').classList.add('busy');
    $('progress').classList.add('show');
    $('barFill').style.width = '0';
    status.className = '';
    const tiles = files.map(addTile);
    let done = 0, failed = 0;

    status.textContent = T.uploading(0, files.length);
    let next = 0;

    // A few workers pull files off the queue so several upload at once
    async function worker() {
      while (next < files.length) {
        const i = next++;
        const tile = tiles[i];
        tile.className = 'tile up';
        let ok = false;
        try {
          const file = await shrink(files[i]);
          if (file.size > MAX_BYTES) tile.title = T.tooBig;
          else ok = await uploadWithRetry(file);
        } catch (_) { /* counted as failed */ }
        tile.className = 'tile ' + (ok ? 'ok' : 'err');
        tile.querySelector('.badge span').textContent = ok ? '✓' : '!';
        ok ? done++ : failed++;
        status.textContent = T.uploading(done + failed, files.length);
        $('barFill').style.width = ((done + failed) / files.length * 100) + '%';
      }
    }
    await Promise.all(Array.from({ length: Math.min(PARALLEL, files.length) }, worker));

    if (failed) { status.textContent = T.partial(done, failed); }
    else { status.textContent = T.done(done); status.className = 'done'; }
    $('pick').classList.remove('busy');
    $('pick').querySelector('span').textContent = T.more;
  });

  function addTile(file) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    const isVideo = file.type.startsWith('video');
    tile.innerHTML = `<div class="ph">${isVideo ? '🎬' : '📷'}</div><div class="badge"><span></span></div>`;
    const media = document.createElement(isVideo ? 'video' : 'img');
    if (isVideo) { media.muted = true; media.playsInline = true; media.preload = 'metadata'; }
    media.onerror = () => media.remove(); // e.g. HEIC on non-Apple browsers: keep the icon
    media.src = URL.createObjectURL(file);
    tile.prepend(media);
    $('grid').prepend(tile);
    return tile;
  }

  // Downscale big photos to a high-quality JPEG; anything else (videos, small or undecodable files) goes as-is
  async function shrink(file) {
    if (!SHRINK_PHOTOS || !file.type.startsWith('image/') || file.type === 'image/gif' || file.size < 1.5 * 1024 * 1024) return file;
    try {
      const img = await createImageBitmap(file, { imageOrientation: 'from-image' });
      const scale = Math.min(1, MAX_SIDE / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      img.close();
      const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
      canvas.width = canvas.height = 0; // free phone memory right away
      if (!blob || blob.size >= file.size) return file;
      return new File([blob], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' });
    } catch (_) {
      return file;
    }
  }

  async function uploadWithRetry(file) {
    const data = await toBase64(file);
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        // Plain-string body keeps this a "simple" CORS request, which Apps Script accepts
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ key, table, name: file.name, mimeType: file.type, data }),
        });
        const json = await res.json();
        if (json.ok) return true;
        if (json.error === 'Invalid event link' || json.error === 'File too large') return false;
      } catch (_) { /* network hiccup, retry */ }
      await new Promise((r) => setTimeout(r, 2000 * (attempt + 1)));
    }
    return false;
  }

  function toBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result.split(',')[1]);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
</script>
</body>
</html>
